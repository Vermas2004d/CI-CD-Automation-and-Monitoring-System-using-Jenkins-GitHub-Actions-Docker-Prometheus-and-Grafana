services:
  backend:
    build:
      context: ./Backened
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    env_file:
      - ./Backened/.env
    dns:
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - railway-net

  frontend:
    build:
      context: ./Frontened/Railway
      dockerfile: Dockerfile
    ports:
      - "80:80"
    env_file:
      - ./Frontened/Railway/.env
    networks:
      - railway-net
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus:/etc/prometheus
    ports:
      - "9090:9090"
    networks:
      - railway-net

  grafana:
    image: grafana/grafana:latest
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - railway-net
    depends_on:
      - prometheus

networks:
  railway-net:
    driver: bridge
